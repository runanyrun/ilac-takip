name: Worker API tests
on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/worker-tests.yml'
  push:
    branches:
      - 'develop'
    paths:
      - 'cloudflare/**'
      - '.github/workflows/worker-tests.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test cloudflare/worker.test.mjs
