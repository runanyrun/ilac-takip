name: Worker API tests
on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/worker-tests.yml'
  push:
    branches:
      - 'feature/cloudflare-d1-foundation'
    paths:
      - 'cloudflare/**'
      - '.github/workflows/worker-tests.yml'
jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cloudflare/worker.test.mjs
