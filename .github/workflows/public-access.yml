name: Read-only Pages access check
on:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  public-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/issue7/check-public-access.mjs
