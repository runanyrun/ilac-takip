name: Publish iPhone preview to GitHub Pages
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-preview
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated static app
        run: |
          mkdir -p _preview/src
          cp index.html manifest.json sw.js _preview/
          cp src/main.js src/styles.css src/safety.js _preview/src/
          touch _preview/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _preview
      - id: deployment
        uses: actions/deploy-pages@v4
